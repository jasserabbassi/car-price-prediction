name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint imports (smoke import)
        run: |
          python -c "import config, utils, metrics, prediction_utils, quality_report"
          python -c "import train_model, tune_hyperparameters, wilcoxon_test"
          python -c "import api"
          # Streamlit app import is opt-in (heavy); skipped here.

      - name: Run unit tests (no trained models needed)
        run: |
          pytest tests.py -v -k "not TestTrainedArtefacts"
